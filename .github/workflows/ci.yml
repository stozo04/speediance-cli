name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check agent instructions
        run: make check-agents
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # golangci-lint embeds the Go type-checker of the toolchain it was
          # built with, so it must be built with a Go >= the toolchain it lints
          # under. This lane pins Go 1.26 to match v2.12.2; build/test still use
          # stable. Bump this pair together when adopting a newer lint toolchain;
          # also update them if go.mod's `go` directive outpaces the linter,
          # otherwise it panics: "file requires newer Go version ... (built with ...)".
          version: v2.12.2

  clawhub-package:
    name: clawhub package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check what clawhub would publish
        run: make check-clawhub

  agent-skills-spec:
    name: agent skills spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate every skill copy with the upstream skills-ref (tracks spec updates)
        run: |
          for harness in .claude .codex .cursor; do
            pipx run --spec "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref" \
              skills-ref validate "$harness/skills/speediance"
          done
