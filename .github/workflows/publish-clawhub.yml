name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check what clawhub would publish
        run: make check-clawhub

      - name: Install clawhub CLI
        run: npm install -g clawhub@0.26.0

      - name: Authenticate clawhub
        run: clawhub login --token "$CLAWHUB_TOKEN"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish skill
        run: clawhub skill publish . --owner stozo04 --slug speediance --name "Speediance Gym Monster"
